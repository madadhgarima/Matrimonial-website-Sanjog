<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sanjog | Choose Your Forever</title>

    <!-- 3-second automatic redirect to login page -->
    <meta http-equiv="refresh" content="3;url=login.html">

    <link rel="stylesheet" href="welcome.css">

</head>


<body>

    <!-- Decorative background elements -->

    <div class="circle circle-one"></div>
    <div class="circle circle-two"></div>

    <div class="decor decor-left">✦</div>
    <div class="decor decor-right">✦</div>


    <!-- Main content -->

    <main class="welcome-container">


        <!-- Small top text -->

        <p class="welcome-text">
            WELCOME TO
        </p>


        <!-- Logo -->

        <div class="logo-wrapper">

            <img
                src="loginimages/logo.jpeg"
                alt="Sanjog Logo"
                class="logo"
            >

        </div>


        <!-- Brand name -->

        <h1>
            Sanjog
        </h1>


        <!-- Tagline -->

        <p class="tagline">
            Choose Your Forever
        </p>


        <!-- Decorative divider -->

        <div class="divider">

            <span></span>

            <div class="diamond">◆</div>

            <span></span>

        </div>


        <!-- Main heading -->

        <h2>
            Meet. Connect. Find<br>
            <span>Your Sanjog.</span>
        </h2>


        <!-- Description -->

        <p class="description">
            Where meaningful connections turn into
            beautiful beginnings.
        </p>


        <!-- Loading section -->

        <div class="loading-section">

            <p class="loading-text">
                Preparing your journey
            </p>

            <div class="loading-background">

                <div class="loading-bar"></div>

            </div>

        </div>


    </main>


    <!-- Bottom text -->

    <div class="bottom-text">
        <span>♥</span>
        Meaningful Connections · Beautiful Beginnings
        <span>♥</span>
    </div>


</body>

</html>
